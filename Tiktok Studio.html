async function postImageGen({
  parts,
  aspectRatio = "1:1",
  filename
}) {
  const apiKey = "";
  const model = "gemini-3.1-flash-image";
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const requestBody = {
    contents: [{ role: "user", parts }],
    generationConfig: {
      responseModalities: ["IMAGE"],
      imageConfig: {
        aspectRatio
      }
    }
  };
  let res;
  try {
    res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestBody)
    });
  } catch {
    throw new Error("Tidak dapat terhubung ke Gemini API. Periksa koneksi internet Anda.");
  }
  if (!res.ok) {
    const msg = await parseGeminiErrorMessage(res);
    throw new Error(mapFriendlyGeminiError(res.status, msg));
  }
  const payload = await res.json();
  const candidateParts = payload?.candidates?.[0]?.content?.parts || [];
  const imagePart = candidateParts.find((p) => p?.inlineData?.data);
  if (!imagePart?.inlineData?.data) {
    throw new Error("Model tidak mengembalikan data gambar base64.");
  }
  const mimeType = imagePart.inlineData.mimeType || "image/png";
  const dataUrl = `data:${mimeType};base64,${imagePart.inlineData.data}`;
  return imageObjectFromDataUrl(dataUrl, filename || `studio-output-${Date.now()}.png`);
}

async function postCaptionPrompt({
  parts,
  systemInstruction,
  useGoogleSearch = false
}) {
  const apiKey = "";
  const model = "gemini-2.5-flash";
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const requestBody = {
    contents: [{ role: "user", parts }]
  };
  if (systemInstruction && String(systemInstruction).trim()) {
    requestBody.systemInstruction = {
      parts: [{ text: String(systemInstruction).trim() }]
    };
  }
  if (useGoogleSearch) {
    requestBody.tools = [{ google_search: {} }];
  }
  let res;
  try {
    res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestBody)
    });
  } catch {
    throw new Error("Tidak dapat terhubung ke Gemini API. Periksa koneksi internet Anda.");
  }
  if (!res.ok) {
    const msg = await parseGeminiErrorMessage(res);
    throw new Error(mapFriendlyGeminiError(res.status, msg));
  }
  const payload = await res.json();
  const candidate = payload?.candidates?.[0];
  const candidateParts = candidate?.content?.parts || [];
  const rawText = candidateParts.map((p) => typeof p?.text === "string" ? p.text : "").join("").trim();
  if (!rawText) {
    throw new Error("Respons teks Caption Maker dari model Gemini kosong.");
  }
  const groundingChunks = Array.isArray(candidate?.groundingMetadata?.groundingChunks) ? candidate.groundingMetadata.groundingChunks : [];
  return {
    rawText,
    groundingChunks
  };
