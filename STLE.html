<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171213">
<meta name="color-scheme" content="dark">
<title>Mechrite Red Clay — Input Studio</title>

<style>
/* =========================================
   01. DESIGN TOKENS & RESET
========================================= */
:root {
  --kokushoku: #171213;
  --eclipse: #3D3837;
  --young-night: #242323;
  --mechrite: #A11A17;
  --ravine: #D2CEC7;

  --clay-top: #b8201d;
  --clay-bottom: #851310;
  --clay-shadow: rgba(55, 6, 5, .75);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 40px 20px;
  overflow-x: hidden;
  color: var(--ravine);
  background:
    radial-gradient(ellipse at 50% 18%, #302b2b 0%, #242323 43%, #171213 82%);
}

button, input, select, textarea {
  font: inherit;
}

button {
  -webkit-appearance: none;
  appearance: none;
}

/* =========================================
   02. TWO-COLUMN WORKSPACE
========================================= */
.workspace {
  --extension-space: 138px;
  width: min(738px, 100%);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 355px));
  align-items: start;
  gap: 28px;
}

/* The extension belongs exclusively to this stage/card. */
.card-stage {
  position: relative;
  width: 100%;
  min-width: 0;
  padding-bottom: 0;
  transition: padding-bottom .42s cubic-bezier(.2,.8,.2,1);
  isolation: isolate;
}

.card-stage.is-expanded {
  padding-bottom: var(--extension-space);
}

/* =========================================
   03. PRIMARY MECHRITE CLAY CARD
========================================= */
.clay {
  position: relative;
  z-index: 3;
  width: 100%;
  padding: 30px 30px 84px;
  border: 1px solid rgba(255, 190, 180, .08);
  border-radius: 42px;
  transform-style: preserve-3d;
  background: linear-gradient(145deg, var(--clay-top), var(--clay-bottom));
  transition:
    transform .5s cubic-bezier(.34,1.56,.64,1),
    background .35s ease,
    box-shadow .35s ease;
  box-shadow:
    24px 28px 54px rgba(10,7,8,.82),
    -10px -10px 24px rgba(210,206,199,.10),
    inset 8px 8px 16px rgba(255,145,140,.36),
    inset -10px -12px 22px rgba(55,6,5,.78);
}

.clay:hover {
  transform: translateY(-5px) rotateX(2deg) rotateY(-2deg);
}

.clay.clay-muted {
  background: linear-gradient(145deg, #514b49, #292525);
  box-shadow:
    24px 28px 54px rgba(10,7,8,.82),
    -10px -10px 24px rgba(210,206,199,.08),
    inset 8px 8px 16px rgba(210,206,199,.15),
    inset -10px -12px 22px rgba(10,7,8,.78);
}

.input-card.clay-muted {
  background: linear-gradient(145deg, #514b49, #292525);
  box-shadow:
    24px 28px 54px rgba(10,7,8,.82),
    -10px -10px 24px rgba(210,206,199,.08),
    inset 8px 8px 16px rgba(210,206,199,.15),
    inset -10px -12px 22px rgba(10,7,8,.78);
}

/* =========================================
   04. CLAY NAVIGATION TABS
========================================= */
.swatches {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 20px;
  transform: translateZ(20px);
}

/* Three static clay tabs: deliberately identical and non-interactive. */
.clay-tab {
  min-width: 0;
  min-height: 35px;
  padding: 8px 6px;
  border: 1px solid rgba(0,0,0,.10);
  border-radius: 12px;
  color: #111111;
  background: linear-gradient(145deg, #ffffff, #e9e9e9);
  font-size: .66rem;
  font-weight: 850;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: default;
  box-shadow:
    4px 6px 10px rgba(35,4,4,.35),
    inset 2px 2px 5px rgba(255,255,255,.95),
    inset -3px -3px 6px rgba(0,0,0,.10);
}

.clay-tab:focus {
  outline: none;
}

/* =========================================
   05. AVATAR & CARD TEXT
========================================= */
.orb {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
  border-radius: 24px;
  background: linear-gradient(145deg, #4d4746, #2c2827);
  font-size: 28px;
  transform: translateZ(25px);
  transition: transform .45s cubic-bezier(.34,1.65,.64,1);
  box-shadow:
    10px 14px 24px rgba(55,6,5,.72),
    inset 5px 5px 10px rgba(210,206,199,.26),
    inset -6px -6px 14px rgba(23,18,19,.82);
}

.clay:hover .orb {
  transform: translateZ(38px) scale(1.1) rotate(-7deg);
}

.card-title {
  color: var(--ravine);
  text-align: center;
  font-size: 1.3rem;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
  margin-bottom: 5px;
  transform: translateZ(18px);
}

.subtitle {
  color: #f5d0ce;
  text-align: center;
  font-size: .77rem;
  line-height: 1.5;
  margin-bottom: 17px;
  transform: translateZ(14px);
}

/* =========================================
   06. MODE TOGGLE
========================================= */
.well {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  margin-bottom: 14px;
  border-radius: 22px;
  background: var(--kokushoku);
  color: var(--ravine);
  font-size: .84rem;
  font-weight: 800;
  box-shadow:
    inset 6px 6px 12px rgba(8,5,6,.92),
    inset -4px -4px 10px rgba(255,145,140,.17);
}

.toggle {
  width: 58px;
  height: 32px;
  flex: 0 0 58px;
  display: flex;
  align-items: center;
  padding: 4px;
  border: 0;
  border-radius: 50px;
  cursor: pointer;
  background: var(--eclipse);
  transition: background .3s ease;
  box-shadow:
    inset 4px 4px 8px rgba(10,7,8,.88),
    inset -3px -3px 6px rgba(210,206,199,.16);
}

.toggle.active {
  background: var(--mechrite);
}

.knob {
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  border-radius: 50%;
  background: linear-gradient(145deg, #e3dfd8, #b5b0a8);
  transition: transform .4s cubic-bezier(.34,1.65,.64,1);
  box-shadow:
    3px 4px 8px rgba(0,0,0,.6),
    inset 2px 2px 4px rgba(255,255,255,.75),
    inset -3px -3px 5px rgba(61,56,55,.42);
}

.toggle.active .knob {
  transform: translateX(26px);
}

/* =========================================
   07. PRIMARY CARD DROPDOWN
========================================= */
.dd {
  position: relative;
  z-index: 5;
  margin-bottom: 18px;
  transform: translateZ(24px);
}

.dd-btn {
  width: 100%;
  min-height: 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 13px 18px;
  border: 0;
  border-radius: 22px;
  cursor: pointer;
  color: var(--ravine);
  background: linear-gradient(145deg, #3D3837, #242323);
  text-align: left;
  font-size: .85rem;
  font-weight: 800;
  box-shadow:
    8px 12px 20px rgba(55,6,5,.65),
    inset 4px 4px 8px rgba(210,206,199,.19),
    inset -5px -6px 12px rgba(23,18,19,.78);
  transition: transform .3s ease;
}

.dd-btn:hover {
  transform: scale(1.015);
}

.arrow {
  color: var(--ravine);
  font-size: .8rem;
  transition: transform .3s ease;
}

.dd.open .arrow {
  transform: rotate(180deg);
}

.dd-menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  z-index: 20;
  padding: 8px;
  border: 1px solid rgba(210,206,199,.08);
  border-radius: 20px;
  background: linear-gradient(145deg, #302b2b, #171213);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-8px) scale(.97);
  transform-origin: top center;
  transition:
    opacity .22s ease,
    visibility .22s ease,
    transform .28s cubic-bezier(.34,1.6,.64,1);
  box-shadow: 12px 18px 30px rgba(0,0,0,.72);
}

.dd.open .dd-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.dd-item {
  width: 100%;
  padding: 10px 13px;
  border: 0;
  border-radius: 13px;
  color: var(--ravine);
  background: transparent;
  text-align: left;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease;
}

.dd-item:hover,
.dd-item:focus-visible {
  background: linear-gradient(145deg, var(--clay-top), var(--clay-bottom));
  transform: translateX(3px);
}

/* =========================================
   08. MAIN ACTION BUTTON
========================================= */
.main-action {
  width: 100%;
  min-height: 50px;
  padding: 14px 16px;
  border: 0;
  border-radius: 24px;
  color: var(--kokushoku);
  background: linear-gradient(145deg, #e3dfd8, #b5b0a8);
  font-size: .95rem;
  font-weight: 900;
  cursor: pointer;
  transform: translateZ(20px);
  transition: transform .3s ease, filter .2s ease;
  box-shadow:
    10px 14px 26px rgba(55,6,5,.62),
    inset 5px 5px 10px rgba(255,255,255,.72),
    inset -6px -6px 14px rgba(61,56,55,.38);
}

.main-action:hover {
  transform: translateZ(32px) scale(1.025);
  filter: brightness(1.05);
}

.main-action:active {
  transform: translateZ(10px) scale(.98);
}

/* =========================================
   09. BLACK DEVIL-HEAD REVEAL BUTTON
========================================= */
.devil-control {
  position: absolute;
  left: 22px;
  bottom: 17px;
  z-index: 6;
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 0;
  cursor: pointer;
  color: #090909;
  background: transparent;
  box-shadow: none;
  transition: transform .28s ease, filter .28s ease;
}

/* Only the black devil-head remains visible; no dark square behind it. */
.devil-control:hover {
  transform: translateY(-3px) scale(1.08);
  filter: drop-shadow(0 4px 3px rgba(35,0,0,.48));
}

.devil-control:active {
  transform: translateY(1px) scale(.96);
}

.devil-control svg {
  width: 34px;
  height: 34px;
  display: block;
  overflow: visible;
  filter: drop-shadow(0 2px 2px rgba(35,0,0,.38));
}

.devil-label {
  position: absolute;
  left: 82px;
  bottom: 34px;
  z-index: 6;
  color: rgba(245,208,206,.78);
  font-size: .64rem;
  font-weight: 850;
  letter-spacing: .13em;
  pointer-events: none;
}

.devil-control[aria-expanded="true"] {
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.58));
}

/* =========================================
   10. SECONDARY CLAY THAT SLIDES FROM THE
       PRIMARY CARD ONLY
========================================= */
.clay-extension {
  position: absolute;
  top: calc(100% - var(--extension-space) - 24px);
  left: 12px;
  right: 12px;
  z-index: 1;
  height: 162px;
  padding: 43px 22px 18px;
  overflow: hidden;
  border: 1px solid rgba(255,170,160,.12);
  border-radius: 0 0 30px 30px;
  color: #f5d0ce;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,120,110,.24), transparent 58%),
    linear-gradient(155deg, #a51b18 0%, #74100e 58%, #3b0b0a 100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-34px) scale(.96);
  transform-origin: top center;
  transition:
    opacity .32s ease,
    visibility .32s ease,
    transform .48s cubic-bezier(.2,.85,.25,1);
  box-shadow:
    12px 20px 30px rgba(0,0,0,.58),
    inset 5px 5px 11px rgba(255,160,150,.22),
    inset -7px -8px 14px rgba(35,3,3,.62);
}

.clay-extension::before {
  content: "";
  position: absolute;
  top: 16px;
  left: 22px;
  right: 22px;
  height: 2px;
  border-radius: 50%;
  background: linear-gradient(90deg, transparent, rgba(255,190,180,.45), transparent);
  box-shadow: 0 2px 8px rgba(255,120,110,.22);
}

.card-stage.is-expanded .clay-extension {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.extension-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}

.extension-title {
  color: #f5d0ce;
  font-size: .76rem;
  font-weight: 900;
  letter-spacing: .12em;
}

.extension-index {
  padding: 4px 8px;
  border: 1px solid rgba(255,220,210,.18);
  border-radius: 20px;
  color: #f5d0ce;
  font-size: .61rem;
  font-weight: 800;
  background: rgba(35,5,5,.28);
}

.extension-description {
  color: rgba(255,225,220,.78);
  font-size: .74rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.extension-texture {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
  color: #fff0ec;
  font-size: .66rem;
  font-weight: 800;
}

.extension-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: #f2c3b9;
  box-shadow: 0 0 8px rgba(255,220,210,.7);
}

/* =========================================
   11. RIGHT-HAND INPUT CARD
========================================= */
.input-card {
  width: 100%;
  min-width: 0;
  padding: 27px 25px 25px;
  border: 1px solid rgba(255, 190, 180, .08);
  border-radius: 34px;

  /* Match the primary card's Mechrite Red clay surface. */
  background: linear-gradient(145deg, var(--clay-top), var(--clay-bottom));

  box-shadow:
    24px 28px 54px rgba(10,7,8,.82),
    -10px -10px 24px rgba(210,206,199,.10),
    inset 8px 8px 16px rgba(255,145,140,.36),
    inset -10px -12px 22px rgba(55,6,5,.78);

  transition:
    background .35s ease,
    box-shadow .35s ease;
}

.input-header {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 24px;
}

.input-icon {
  width: 47px;
  height: 47px;
  flex: 0 0 47px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: var(--ravine);
  background: linear-gradient(145deg, #494241, #252121);
  box-shadow:
    6px 8px 15px rgba(0,0,0,.42),
    inset 3px 3px 6px rgba(210,206,199,.15),
    inset -4px -4px 8px rgba(0,0,0,.55);
}

.input-icon svg {
  width: 23px;
  height: 23px;
}

.input-heading {
  color: var(--ravine);
  font-size: 1.02rem;
  font-weight: 900;
  line-height: 1.2;
}

.input-subtitle {
  margin-top: 4px;
  color: #aaa19c;
  font-size: .69rem;
  line-height: 1.4;
}

.input-form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}

.field-label {
  color: #d8d0ca;
  font-size: .73rem;
  font-weight: 800;
  letter-spacing: .025em;
}

.field-control {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 11px 13px;
  border: 1px solid rgba(210,206,199,.07);
  border-radius: 14px;
  outline: none;
  color: var(--ravine);
  background: #191516;
  font-size: .79rem;
  box-shadow:
    inset 4px 4px 8px rgba(0,0,0,.55),
    inset -2px -2px 6px rgba(210,206,199,.035);
  transition: border-color .2s ease, box-shadow .2s ease;
}

.field-control::placeholder {
  color: #746c69;
}

.field-control:focus {
  border-color: rgba(210,206,199,.38);
  box-shadow:
    inset 4px 4px 8px rgba(0,0,0,.45),
    0 0 0 3px rgba(161,26,23,.20);
}

textarea.field-control {
  min-height: 88px;
  resize: vertical;
  line-height: 1.5;
}

.color-row {
  display: grid;
  grid-template-columns: 1fr 48px;
  gap: 9px;
  align-items: center;
}

.color-control {
  width: 48px;
  height: 44px;
  padding: 5px;
  border: 1px solid rgba(210,206,199,.10);
  border-radius: 13px;
  background: #191516;
  cursor: pointer;
  box-shadow: inset 3px 3px 7px rgba(0,0,0,.5);
}

.color-control::-webkit-color-swatch-wrapper {
  padding: 2px;
}

.color-control::-webkit-color-swatch {
  border: 0;
  border-radius: 8px;
}

.color-control::-moz-color-swatch {
  border: 0;
  border-radius: 8px;
}

.apply-button {
  width: 100%;
  min-height: 46px;
  margin-top: 3px;
  padding: 12px 16px;
  border: 0;
  border-radius: 17px;
  color: #211b1a;
  background: linear-gradient(145deg, #e3dfd8, #b5b0a8);
  font-size: .82rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    7px 9px 17px rgba(0,0,0,.42),
    inset 3px 3px 7px rgba(255,255,255,.68),
    inset -4px -4px 8px rgba(61,56,55,.32);
  transition: transform .25s ease, filter .2s ease;
}

.apply-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}

.apply-button:active {
  transform: translateY(1px) scale(.985);
}

.form-feedback {
  min-height: 17px;
  color: #d9b8ad;
  font-size: .69rem;
  line-height: 1.4;
}

/* =========================================
   12. FOCUS & RESPONSIVE
========================================= */
button:focus-visible {
  outline: 2px solid var(--ravine);
  outline-offset: 3px;
}

@media (max-width: 780px) {
  body {
    padding: 32px 16px;
    place-items: start center;
  }

  .workspace {
    width: min(355px, 100%);
    grid-template-columns: minmax(0, 1fr);
    gap: 27px;
  }

  .input-card {
    border-radius: 30px;
  }
}

@media (max-width: 390px) {
  .clay {
    padding: 26px 22px 82px;
    border-radius: 34px;
  }

  .input-card {
    padding: 23px 20px;
  }

  .swatches {
    gap: 7px;
  }

  .clay-tab {
    min-height: 33px;
    padding-inline: 4px;
    font-size: .59rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div class="workspace">

  <!-- =====================================
       LEFT: PRIMARY CARD + LOWER CLAY LAYER
  ====================================== -->
  <section class="card-stage" id="cardStage" aria-label="Mechrite clay card">

    <main
      class="clay"
      id="clayTabPanel"
      role="tabpanel"
      aria-labelledby="tab-mechrite"
      tabindex="0"
    >

      <div class="swatches" aria-label="Clay tabs">
        <button type="button" class="clay-tab">CLAY 01</button>
        <button type="button" class="clay-tab">CLAY 02</button>
        <button type="button" class="clay-tab">CLAY 03</button>
      </div>

      <div class="orb" aria-hidden="true">🩸</div>

      <h1 class="card-title" id="cardTitle">Mechrite Red Clay</h1>
      <p class="subtitle">Kokushoku • Eclipse • Young Night • Ravine</p>

      <div class="well">
        <span id="statusText" aria-live="polite">Red Clay Mode: ON</span>
        <button
          type="button"
          class="toggle active"
          id="modeToggle"
          role="switch"
          aria-checked="true"
          aria-label="Toggle Red Clay Mode"
        >
          <span class="knob"></span>
        </button>
      </div>

      <div class="dd" id="clayDD">
        <button
          type="button"
          class="dd-btn"
          id="ddButton"
          aria-expanded="false"
          aria-controls="ddMenu"
        >
          <span id="ddVal">Pilih Tekstur Clay</span>
          <span class="arrow" aria-hidden="true">▼</span>
        </button>

        <div class="dd-menu" id="ddMenu" role="group" aria-label="Pilihan tekstur clay" inert>
          <button type="button" class="dd-item" data-value="Crimson Gloss">🩸 Crimson Gloss</button>
          <button type="button" class="dd-item" data-value="Obsidian Matte">🌑 Obsidian Matte</button>
          <button type="button" class="dd-item" data-value="Ravine Stone">🪨 Ravine Stone</button>
        </div>
      </div>

      <button type="button" class="main-action" id="mainButton">
        Sentuh Mechrite Clay
      </button>

      <!-- Black devil-head button: reveals the clay beneath THIS card. -->
      <button
        type="button"
        class="devil-control"
        id="devilButton"
        aria-label="Tampilkan lapisan clay tambahan"
        aria-expanded="false"
        aria-controls="clayExtension"
        title="Tampilkan lapisan clay tambahan"
      >
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path
            d="M10.1 10.2C7.6 7.6 4.5 4.2 2.1 2.5c-.3 5.8.8 10.3 3.8 13.2-1.2 2-1.4 4.2-.7 6.3C6.8 26.7 11 29.5 16 29.5s9.2-2.8 10.8-7.5c.7-2.1.5-4.3-.7-6.3 3-2.9 4.1-7.4 3.8-13.2-2.4 1.7-5.5 5.1-8 7.7-3.5-2.1-8.3-2.1-11.8 0Z"
            fill="#070707"
            stroke="#000"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
          <path d="M10.8 17.1c1.5-1.7 3.1-1.7 4.5 0l-2.2 2.1-2.3-2.1Zm6 0c1.4-1.7 3-1.7 4.5 0L19 19.2l-2.2-2.1Z" fill="#A11A17"/>
          <path d="M13.2 23.1c1.8 1.1 3.8 1.1 5.6 0" fill="none" stroke="#A11A17" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="devil-label" aria-hidden="true">EXTRA CLAY</span>

    </main>

    <!-- This panel is positioned behind and attached only to the first card. -->
    <section class="clay-extension" id="clayExtension" aria-hidden="true">
      <div class="extension-topline">
        <h2 class="extension-title">SECONDARY CLAY LAYER</h2>
        <span class="extension-index">LAYER 02</span>
      </div>
      <p class="extension-description" id="extensionDescription">
        Lapisan clay tambahan muncul dari bawah card utama.
      </p>
      <div class="extension-texture">
        <span class="extension-dot"></span>
        <span id="extensionTexture">Crimson Gloss</span>
      </div>
    </section>

  </section>


  <!-- =====================================
       RIGHT: INPUT CARD
  ====================================== -->
  <aside class="input-card" aria-labelledby="inputHeading">

    <header class="input-header">
      <div class="input-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h4l11.2-11.2a2.1 2.1 0 0 0-4-4L4 16v4Z"/>
          <path d="m13.8 6.2 4 4"/>
          <path d="M12 20h8"/>
        </svg>
      </div>
      <div>
        <h2 class="input-heading" id="inputHeading">Clay Input</h2>
        <p class="input-subtitle">Atur identitas dan karakter clay</p>
      </div>
    </header>

    <form class="input-form" id="clayForm">

      <div class="field">
        <label class="field-label" for="clayName">Nama Clay</label>
        <input
          class="field-control"
          type="text"
          id="clayName"
          name="clayName"
          value="Mechrite Red Clay"
          maxlength="40"
          required
          autocomplete="off"
          placeholder="Masukkan nama clay"
        >
      </div>

      <div class="field">
        <label class="field-label" for="clayHex">Warna Utama</label>
        <div class="color-row">
          <input
            class="field-control"
            type="text"
            id="clayHex"
            name="clayHex"
            value="#A11A17"
            maxlength="7"
            pattern="^#[0-9A-Fa-f]{6}$"
            title="Gunakan format hex, contoh #A11A17"
            required
            autocomplete="off"
            spellcheck="false"
          >
          <input
            class="color-control"
            type="color"
            id="clayColor"
            name="clayColor"
            value="#a11a17"
            aria-label="Pilih warna utama clay"
          >
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="clayTexture">Tekstur</label>
        <select class="field-control" id="clayTexture" name="clayTexture">
          <option value="Crimson Gloss">Crimson Gloss</option>
          <option value="Obsidian Matte">Obsidian Matte</option>
          <option value="Ravine Stone">Ravine Stone</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="clayDescription">Deskripsi</label>
        <textarea
          class="field-control"
          id="clayDescription"
          name="clayDescription"
          maxlength="160"
          placeholder="Tambahkan catatan tentang clay..."
        >Lapisan clay dengan karakter merah gelap dan finishing 3D.</textarea>
      </div>

      <button class="apply-button" type="submit">
        Terapkan Pengaturan
      </button>

      <p class="form-feedback" id="formFeedback" aria-live="polite"></p>

    </form>

  </aside>

</div>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {
  const root = document.documentElement;

  const cardStage = document.getElementById("cardStage");
  const clayCard = document.getElementById("clayTabPanel");
  const cardTitle = document.getElementById("cardTitle");
  const inputCard = document.querySelector(".input-card");

  const modeToggle = document.getElementById("modeToggle");
  const statusText = document.getElementById("statusText");

  const devilButton = document.getElementById("devilButton");
  const clayExtension = document.getElementById("clayExtension");
  const extensionDescription = document.getElementById("extensionDescription");
  const extensionTexture = document.getElementById("extensionTexture");

  const dropdown = document.getElementById("clayDD");
  const dropdownButton = document.getElementById("ddButton");
  const dropdownMenu = document.getElementById("ddMenu");
  const dropdownValue = document.getElementById("ddVal");
  const dropdownItems = dropdownMenu.querySelectorAll(".dd-item");

  const mainButton = document.getElementById("mainButton");
  const actionTimer = { id: null };

  const clayForm = document.getElementById("clayForm");
  const clayName = document.getElementById("clayName");
  const clayHex = document.getElementById("clayHex");
  const clayColor = document.getElementById("clayColor");
  const clayTexture = document.getElementById("clayTexture");
  const clayDescription = document.getElementById("clayDescription");
  const formFeedback = document.getElementById("formFeedback");

  /* ---------------------------------------
     RED CLAY MODE
  --------------------------------------- */
  function setClayMode(enabled) {
    modeToggle.classList.toggle("active", enabled);
    clayCard.classList.toggle("clay-muted", !enabled);
    inputCard.classList.toggle("clay-muted", !enabled);
    modeToggle.setAttribute("aria-checked", String(enabled));
    statusText.textContent = enabled
      ? "Red Clay Mode: ON"
      : "Red Clay Mode: OFF";
  }

  modeToggle.addEventListener("click", () => {
    const isActive = modeToggle.getAttribute("aria-checked") === "true";
    setClayMode(!isActive);
  });

  /* ---------------------------------------
     DEVIL BUTTON: REVEAL LOWER CLAY
  --------------------------------------- */
  function setExtensionOpen(open) {
    cardStage.classList.toggle("is-expanded", open);
    devilButton.setAttribute("aria-expanded", String(open));
    devilButton.setAttribute(
      "aria-label",
      open ? "Sembunyikan lapisan clay tambahan" : "Tampilkan lapisan clay tambahan"
    );
    devilButton.title = open
      ? "Sembunyikan lapisan clay tambahan"
      : "Tampilkan lapisan clay tambahan";
    clayExtension.setAttribute("aria-hidden", String(!open));
  }

  devilButton.addEventListener("click", () => {
    const isOpen = devilButton.getAttribute("aria-expanded") === "true";
    setExtensionOpen(!isOpen);
  });

  /* ---------------------------------------
     DROPDOWN
  --------------------------------------- */
  function setDropdown(open) {
    dropdown.classList.toggle("open", open);
    dropdownButton.setAttribute("aria-expanded", String(open));
    dropdownMenu.inert = !open;
  }

  function closeDropdown() {
    setDropdown(false);
  }

  dropdownButton.addEventListener("click", () => {
    const isOpen = dropdownButton.getAttribute("aria-expanded") === "true";
    setDropdown(!isOpen);
  });

  dropdownItems.forEach((item) => {
    item.addEventListener("click", () => {
      const value = item.dataset.value;
      if (!value) return;

      dropdownValue.textContent = value;
      clayTexture.value = value;
      extensionTexture.textContent = value;
      closeDropdown();
      dropdownButton.focus();
    });
  });

  document.addEventListener("click", (event) => {
    if (!dropdown.contains(event.target)) closeDropdown();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && dropdownButton.getAttribute("aria-expanded") === "true") {
      closeDropdown();
      dropdownButton.focus();
    }
  });

  dropdownButton.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown" && dropdownButton.getAttribute("aria-expanded") === "true") {
      event.preventDefault();
      dropdownItems[0]?.focus();
    }
  });

  dropdownItems.forEach((item, index) => {
    item.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        const direction = event.key === "ArrowDown" ? 1 : -1;
        const nextIndex = (index + direction + dropdownItems.length) % dropdownItems.length;
        dropdownItems[nextIndex].focus();
      }

      if (event.key === "Escape") {
        event.preventDefault();
        closeDropdown();
        dropdownButton.focus();
      }
    });
  });

  /* ---------------------------------------
     MAIN BUTTON FEEDBACK
  --------------------------------------- */
  mainButton.addEventListener("click", () => {
    if (mainButton.disabled) return;

    mainButton.textContent = "Mechrite Clay Activated";
    mainButton.disabled = true;

    if (actionTimer.id !== null) {
      window.clearTimeout(actionTimer.id);
    }

    actionTimer.id = window.setTimeout(() => {
      mainButton.textContent = "Sentuh Mechrite Clay";
      mainButton.disabled = false;
      actionTimer.id = null;
    }, 1400);
  });

  /* ---------------------------------------
     COLOR UTILITIES
  --------------------------------------- */
  function mixHex(hex, targetHex, amount) {
    const source = hex.replace("#", "");
    const target = targetHex.replace("#", "");

    const sourceChannels = [0, 2, 4].map((offset) => parseInt(source.slice(offset, offset + 2), 16));
    const targetChannels = [0, 2, 4].map((offset) => parseInt(target.slice(offset, offset + 2), 16));

    const mixed = sourceChannels.map((channel, index) => {
      const value = Math.round(channel * (1 - amount) + targetChannels[index] * amount);
      return value.toString(16).padStart(2, "0");
    });

    return `#${mixed.join("")}`;
  }

  /* ---------------------------------------
     SHARED CLAY COLOR
     The three white tabs above are intentionally
     display-only buttons. They have no click action.
  --------------------------------------- */
  function applyClayColor(hex) {
    const normalizedHex = hex.toUpperCase();
    const topColor = mixHex(normalizedHex, "#FFFFFF", 0.12);
    const bottomColor = mixHex(normalizedHex, "#000000", 0.27);

    root.style.setProperty("--clay-top", topColor);
    root.style.setProperty("--clay-bottom", bottomColor);
    root.style.setProperty("--mechrite", normalizedHex);
  }

  /* Keep the text hex field and native color picker synchronized. */
  clayColor.addEventListener("input", () => {
    clayHex.value = clayColor.value.toUpperCase();
    clayHex.setCustomValidity("");
  });

  clayHex.addEventListener("input", () => {
    const validHex = /^#[0-9A-Fa-f]{6}$/.test(clayHex.value.trim());
    if (validHex) {
      clayColor.value = clayHex.value.trim();
      clayHex.setCustomValidity("");
    } else {
      clayHex.setCustomValidity("Masukkan kode warna dengan format #RRGGBB.");
    }
  });

  /* ---------------------------------------
     INPUT CARD: APPLY CONFIGURATION
  --------------------------------------- */
  clayForm.addEventListener("submit", (event) => {
    event.preventDefault();

    const name = clayName.value.trim();
    const hex = clayHex.value.trim();
    const texture = clayTexture.value;
    const description = clayDescription.value.trim();

    if (!name) {
      clayName.setCustomValidity("Nama clay wajib diisi.");
      clayName.reportValidity();
      return;
    }
    clayName.setCustomValidity("");

    if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) {
      clayHex.setCustomValidity("Masukkan kode warna dengan format #RRGGBB.");
      clayHex.reportValidity();
      return;
    }
    clayHex.setCustomValidity("");

    const normalizedHex = hex.toUpperCase();

    /* Update the shared clay palette so BOTH cards stay identical. */
    applyClayColor(normalizedHex);
    cardTitle.textContent = name;

    /* Keep the extension attached to the primary card. */
    extensionTexture.textContent = texture;
    extensionDescription.textContent = description || "Lapisan clay tambahan muncul dari bawah card utama.";

    /* Synchronize the dropdown with the input panel. */
    dropdownValue.textContent = texture;

    formFeedback.textContent = "Pengaturan clay berhasil diterapkan.";
  });
});
</script>

</body>
</html>
